            </div>
            ${renderHardButton(card.id)}
          </div>

          <div class="front-center">
            <h2 class="front-word">${esc(card.word)}</h2>
            <div class="audio-row">
              <button type="button" class="audio-btn primary" data-audio-btn="front-1x" onclick="speakDE('${jsArg(card.word)}', 'front-1x', 1.0, event)">
                ${speakerSvg(16)}
                <span>1.0x</span>
              </button>
              <button type="button" class="audio-btn slow" data-audio-btn="front-slow" onclick="speakDE('${jsArg(card.word)}', 'front-slow', 0.7, event)">
                <span>🐢 0.7x</span>
              </button>
            </div>
          </div>

          <div class="tap-hint">${card.pos === "noun" ? "Recall gender + meaning" : "Recall meaning & usage"} · Tap card to reveal</div>
        </div>
      `;
    }

    /**
     * Render Back of Active Card.
     */
    function renderBackCard(card) {
      // Case Practice Back
      if (card.deckType === "case_practice") {
        const fullSent = card.fullSentence || card.word;
        let highlightedFull = esc(fullSent);
        if (card.answer) {
          const cleanAns = card.answer.replace(/\s*…\s*/g, ".*?");
          if (!card.answer.includes("…") && fullSent.includes(card.answer)) {
            highlightedFull = esc(fullSent).replace(esc(card.answer), `<span class="ans-hl">${esc(card.answer)}</span>`);
          }
        }

        return `
          <article class="card card-back">
            <div class="card-top-row">
              <div class="badge-row">
                <span class="pill pill-${card.level}">${esc(card.level)}</span>
                <span class="pill pill-violet">Case Practice</span>
              </div>
              ${renderHardButton(card.id)}
            </div>

            <section class="section-box case-answer-box">
              <div class="section-head">
                <span class="section-label">Missing Answer</span>
                ${card.answer ? `<span class="pill pill-emerald" style="font-size:12px;">${esc(card.answer)}</span>` : ""}
              </div>
              <p class="case-full-de">${highlightedFull}</p>
              <p class="ex-en" style="margin:0;">${esc(card.english)}</p>
              <div class="audio-row" style="justify-content:stretch;margin-top:4px;">
                <button type="button" class="audio-btn primary" style="flex:1;" data-audio-btn="back-1x" onclick="speakDE('${jsArg(fullSent)}', 'back-1x', 1.0, event)">
                  ${speakerSvg(16)}
                  <span>Listen (1.0x)</span>
                </button>
                <button type="button" class="audio-btn slow" data-audio-btn="back-slow" onclick="speakDE('${jsArg(fullSent)}', 'back-slow', 0.7, event)">
                  <span>🐢 0.7x</span>
                </button>
              </div>
            </section>

            ${renderValencyBlock(card)}
            ${renderExamplesBlock(card, "Contrast Examples")}
          </article>
        `;
      }

      // Vocab & Verb Trap Back
      const isNoun = card.pos === "noun";
      const art = isNoun ? String(card.article || "").toLowerCase() : "";
      const artCls = art === "der" ? "art-der" : art === "die" ? "art-die" : art === "das" ? "art-das" : "";
      const headSpeak = isNoun && card.article ? `${card.article} ${card.word}` : card.word;

      return `
        <article class="card card-back">
          <div class="card-top-row">
            <div class="badge-row">
              <span class="pill pill-${card.level}">${esc(card.level)}</span>
              <span class="pill">${esc(POS_LABELS[card.pos] || card.pos)}</span>
              ${renderPackBadge(card.deckType)}
            </div>
            ${renderHardButton(card.id)}
          </div>

          <div class="back-head">
            <div style="min-width:0;flex:1;">
              <h2 class="back-word">${isNoun && card.article ? `<span class="${artCls}">${esc(card.article)}</span> ` : ""}${esc(card.word)}</h2>
              ${isNoun && card.plural ? `
                <div class="back-plural-row">
                  <span class="pill">Plural: ${esc(card.plural)}</span>
                </div>
              ` : ""}
              <p class="back-english">${esc(card.english)}</p>
            </div>
            <div style="display:flex;gap:5px;flex-shrink:0;">
              <button type="button" class="audio-sq" data-audio-btn="back-1x" onclick="speakDE('${jsArg(headSpeak)}', 'back-1x', 1.0, event)" aria-label="Listen 1.0x">
                ${speakerSvg(16)}
              </button>
              <button type="button" class="audio-sq slow-sq" data-audio-btn="back-slow" onclick="speakDE('${jsArg(headSpeak)}', 'back-slow', 0.7, event)" aria-label="Listen 0.7x">
                0.7x
              </button>
            </div>
          </div>

          ${renderValencyBlock(card)}
          ${renderConjugationsBlock(card)}
          ${renderExamplesBlock(card, "Example Sentences")}
        </article>
      `;
    }

    function renderCard() {
      const stage = document.getElementById("card-stage");
      if (!stage) return;

      const pool = getFilteredPool();

      if (pool.length === 0) {
        const totalHard = getTotalHardCount();
        if (state.hardOnly) {
          stage.innerHTML = `
            <div class="card state-card">
              <div class="state-icon" style="color:var(--orange);">🔥</div>
              <h2 class="state-title">${totalHard === 0 ? "No Hard Cards Yet" : "No Hard Cards in Current Filter"}</h2>
              <p class="state-desc">${
                totalHard === 0
                  ? "Cards automatically appear here after 3 misses, or tap 🔥 Flag on any card to pin it."
                  : `You have ${totalHard} Hard card${totalHard === 1 ? "" : "s"} in other levels or packs.`
              }</p>
              ${totalHard > 0 ? `<button type="button" class="btn-primary-full" onclick="soloAllHardCards()">Drill All ${totalHard} Hard Cards</button>` : ""}
              <button type="button" class="btn-secondary-full" onclick="toggleHardFilter()">Turn Off 🔥 Hard Filter</button>
            </div>
          `;
        } else {
          stage.innerHTML = `
            <div class="card state-card">
              <div class="state-icon" style="color:var(--amber);">✦</div>
              <h2 class="state-title">No Cards Match Filter</h2>
              <p class="state-desc">Enable another CEFR level or pack above, or add your own custom cards in Deck Manager.</p>
              <button type="button" class="btn-primary-full" onclick="openModal('add')">+ Add Custom Card</button>
            </div>
          `;
        }
        return;
      }

      if (state.queue.length === 0) {
        const mastered = pool.filter(c => getSrs(c.id).status === "mastered").length;
        stage.innerHTML = `
          <div class="card state-card">
            <div class="state-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h2 class="state-title">${state.cramMode ? "Practice Round Complete!" : "All Caught Up!"}</h2>
            <p class="state-desc">All due cards in your current filter are scheduled for future review.</p>
            <div class="stat-pair">
              <div class="stat-tile">
                <div class="stat-val" style="color:var(--emerald);">${mastered}/${pool.length}</div>
                <div class="stat-lbl">Mastered</div>
              </div>
              <div class="stat-tile">
                <div class="stat-val" style="color:var(--amber);">🔥 ${state.streak}</div>
                <div class="stat-lbl">Current Streak</div>
              </div>
            </div>
            <button type="button" class="btn-primary-full" onclick="buildQueue(true)">
              Practice All ${pool.length} Cards Anyway
            </button>
            <button type="button" class="btn-secondary-full" onclick="openModal('add')">
              + Add or Import More Cards
            </button>
          </div>
        `;
        return;
      }

      const card = state.queue[0];
      stage.innerHTML = state.isRevealed ? renderBackCard(card) : renderFrontCard(card);
    }

    function renderFooter() {
      const footer = document.getElementById("thumb-footer");
      if (!footer) return;

      if (!state.queue.length) {
        footer.innerHTML = `
          <button type="button" class="btn-secondary-full" onclick="buildQueue(true)">
            Start Extra Practice Round
          </button>
        `;
        return;
      }

      if (!state.isRevealed) {
        footer.innerHTML = `
          <button type="button" class="flip-btn" onclick="flipCard()">Show Answer</button>
          <div class="kbd-bar">Space / Enter: Flip · R: Audio 1.0x · S: Slow 0.7x · H: Toggle 🔥 Hard</div>
        `;
        return;
      }

      const { goodDays, easyDays } = previewIntervals(state.queue[0].id);
      footer.innerHTML = `
        <div class="srs-grid">
          <button type="button" class="srs-btn srs-again" onclick="rateCard('again')">
            <span class="s-main">Again</span>
            <span class="s-sub">Requeue</span>
          </button>
          <button type="button" class="srs-btn srs-good" onclick="rateCard('good')">
            <span class="s-main">Good</span>
            <span class="s-sub">+${goodDays}d</span>
          </button>
          <button type="button" class="srs-btn srs-easy" onclick="rateCard('easy')">
            <span class="s-main">Easy</span>
            <span class="s-sub">+${easyDays}d</span>
          </button>
        </div>
        <div class="kbd-bar">1: Again · 2: Good · 3: Easy · R: Audio 1.0x · S: Slow 0.7x · H: Toggle 🔥 Hard</div>
      `;
    }

    function renderAll() {
      renderHeader();
      renderCard();
      renderFooter();
    }

    /* =========================================================================
       8. 4-TAB DECK & CUSTOM CARD MANAGER MODAL
       ========================================================================= */
    function openModal(tab = "add") {
      stopSpeech();
      state.modalTab = tab;
      if (tab !== "add") state.editingCardId = null;
      state.armedDeleteId = null;
      state.armedResetProgress = false;
      state.armedRestoreDefaults = false;
      refreshGermanVoices();
      document.getElementById("deck-modal").classList.remove("hidden");
      renderModalBody();
    }

    function closeModal() {
      document.getElementById("deck-modal").classList.add("hidden");
      state.editingCardId = null;
      state.armedDeleteId = null;
      state.armedResetProgress = false;
      state.armedRestoreDefaults = false;
    }

    function handleBackdropClick(e) {
      if (e.target.id === "deck-modal") closeModal();
    }

    function switchModalTab(tab) {
      state.modalTab = tab;
      if (tab !== "add") state.editingCardId = null;
      state.armedDeleteId = null;
      state.armedResetProgress = false;
      state.armedRestoreDefaults = false;
      if (tab === "add" && !state.editingCardId) {
        state.formExamples = [{ de: "", en: "" }, { de: "", en: "" }];
      }
      renderModalBody();
    }

    /* --- TAB 1: ADD / EDIT CUSTOM CARD --- */
    let formDraft = null;

    function resetFormDraft(card = null) {
      if (card) {
        formDraft = {
          id: card.id,
          deckType: card.deckType || "vocab",
          level: card.level || "B1",
          pos: card.pos || (card.deckType === "case_practice" ? "case_practice" : "verb"),
          word: card.word || "",
          english: card.english || "",
          article: card.article || "der",
          plural: card.plural || "",
          isIrregular: Boolean(card.isIrregular),
          praesens: (card.conjugations && card.conjugations.praesens) || "",
          praeteritum: (card.conjugations && card.conjugations.praeteritum) || "",
          perfekt: (card.conjugations && card.conjugations.perfekt) || "",
          stemChange: (card.conjugations && card.conjugations.stemChange) || "",
          valency: card.valency || "",
          trapNote: card.trapNote || "",
          answer: card.answer || "",
          fullSentence: card.fullSentence || "",
          promptHint: card.promptHint || "Preposition + Case",
          examples: Array.isArray(card.examples) && card.examples.length
            ? card.examples.map(e => ({ de: e.de || "", en: e.en || "" }))
            : [{ de: "", en: "" }, { de: "", en: "" }]
        };
      } else {
        formDraft = {
          id: "",
          deckType: "vocab",
          level: "B1",
          pos: "verb",
          word: "",
          english: "",
          article: "der",
          plural: "",
          isIrregular: false,
          praesens: "",
          praeteritum: "",
          perfekt: "",
          stemChange: "",
          valency: "",
          trapNote: "",
          answer: "",
          fullSentence: "",
          promptHint: "Preposition + Case",
          examples: [{ de: "", en: "" }, { de: "", en: "" }]
        };
      }
    }

    function syncDraftFromDom() {
      if (!formDraft) return;
      const g = id => {
        const el = document.getElementById(id);
        return el ? el.value : null;
      };
      const dt = g("f-deckType"); if (dt !== null) formDraft.deckType = dt;
      const lv = g("f-level"); if (lv !== null) formDraft.level = lv;
      const ps = g("f-pos"); if (ps !== null) formDraft.pos = ps;
      const wd = g("f-word"); if (wd !== null) formDraft.word = wd;
      const en = g("f-english"); if (en !== null) formDraft.english = en;
      const ar = g("f-article"); if (ar !== null) formDraft.article = ar;
      const pl = g("f-plural"); if (pl !== null) formDraft.plural = pl;
      const irrEl = document.getElementById("f-irregular");
      if (irrEl) formDraft.isIrregular = irrEl.checked;
      const pr = g("f-praesens"); if (pr !== null) formDraft.praesens = pr;
      const pt = g("f-praeteritum"); if (pt !== null) formDraft.praeteritum = pt;
      const pf = g("f-perfekt"); if (pf !== null) formDraft.perfekt = pf;
      const sc = g("f-stemChange"); if (sc !== null) formDraft.stemChange = sc;
      const vl = g("f-valency"); if (vl !== null) formDraft.valency = vl;
      const tn = g("f-trapNote"); if (tn !== null) formDraft.trapNote = tn;
      const an = g("f-answer"); if (an !== null) formDraft.answer = an;
      const fs = g("f-fullSentence"); if (fs !== null) formDraft.fullSentence = fs;
      const ph = g("f-promptHint"); if (ph !== null) formDraft.promptHint = ph;

      formDraft.examples = formDraft.examples.map((ex, i) => ({
        de: g(`f-ex-de-${i}`) ?? ex.de,
        en: g(`f-ex-en-${i}`) ?? ex.en
      }));
    }

    function onFormDeckTypeChange() {
      syncDraftFromDom();
      if (formDraft.deckType === "case_practice") {
        formDraft.pos = "case_practice";
      } else if (formDraft.deckType === "verb_trap") {
        formDraft.pos = "verb";
      } else if (formDraft.pos === "case_practice") {
        formDraft.pos = "noun";
      }
      renderModalBody();
    }

    function onFormPosChange() {
      syncDraftFromDom();
      renderModalBody();
    }

    function addExampleFormRow() {
      syncDraftFromDom();
      formDraft.examples.push({ de: "", en: "" });
      renderModalBody();
    }

    function removeExampleFormRow(idx) {
      syncDraftFromDom();
      if (formDraft.examples.length <= 1) return;
      formDraft.examples.splice(idx, 1);
      renderModalBody();
    }

    function startEditCard(cardId) {
      const found = state.cards.find(c => c.id === cardId);
      if (!found) return;
      state.editingCardId = cardId;
      state.modalTab = "add";
      resetFormDraft(found);
      renderModalBody();
    }

    function cancelEditCard() {
      state.editingCardId = null;
      resetFormDraft(null);
      renderModalBody();
    }

    function saveCustomCard(evt) {
      evt.preventDefault();
      syncDraftFromDom();
      const fb = document.getElementById("form-feedback");

      const word = formDraft.word.trim();
      const english = formDraft.english.trim();
      if (!word || !english) {
        if (fb) fb.innerHTML = `<div class="feedback-msg feedback-err">German word / sentence and English meaning are required.</div>`;
        return;
      }

      const isCase = formDraft.deckType === "case_practice";
      const isNoun = !isCase && formDraft.pos === "noun";
      const isVerb = !isCase && (formDraft.pos === "verb" || formDraft.deckType === "verb_trap");

      if (isCase && (!formDraft.answer.trim() || !formDraft.fullSentence.trim())) {
        if (fb) fb.innerHTML = `<div class="feedback-msg feedback-err">Case Practice cards require both Missing Answer and Full Corrected Sentence.</div>`;
        return;
      }

      const cleanExamples = formDraft.examples
        .map(e => ({ de: e.de.trim(), en: e.en.trim() }))
        .filter(e => e.de);

      const hasConj = isVerb && (formDraft.praesens.trim() || formDraft.praeteritum.trim() || formDraft.perfekt.trim());
      const slug = word.toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").replace(/^-|-$/g, "").slice(0, 28) || "card";
      const id = state.editingCardId || `${formDraft.level.toLowerCase()}-${slug}-${Date.now().toString(36).slice(-4)}`;

      const cardObj = {
        id,
        level: formDraft.level,
        deckType: formDraft.deckType,
        pos: isCase ? "case_practice" : formDraft.pos,
        word,
        english,
        article: isNoun ? formDraft.article : null,
        plural: isNoun && formDraft.plural.trim() ? formDraft.plural.trim() : null,
        isIrregular: isVerb ? Boolean(formDraft.isIrregular) : false,
        conjugations: hasConj ? {
          praesens: formDraft.praesens.trim() || null,
          praeteritum: formDraft.praeteritum.trim() || null,
          perfekt: formDraft.perfekt.trim() || null,
          stemChange: formDraft.stemChange.trim() || null
        } : null,
        valency: formDraft.valency.trim() || null,
        trapNote: formDraft.trapNote.trim() || null,
        answer: isCase ? formDraft.answer.trim() : null,
        fullSentence: isCase ? formDraft.fullSentence.trim() : null,
        promptHint: isCase ? (formDraft.promptHint.trim() || "Preposition + Case") : null,
        examples: cleanExamples
      };

      if (state.editingCardId) {
        const idx = state.cards.findIndex(c => c.id === state.editingCardId);
        if (idx >= 0) state.cards[idx] = cardObj;
        showToast(`Updated "${cardObj.word}"`, "ok");
      } else {
        state.cards.unshift(cardObj);
        showToast(`Added "${cardObj.word}" to deck`, "ok");
      }

      state.editingCardId = null;
      resetFormDraft(null);
      saveState();
      buildQueue(false, false);
      closeModal();
    }

    /* --- TAB 2: BROWSE, SEARCH, EDIT, DELETE --- */
    function onBrowseSearch(val) {
      state.browseSearch = val;
      renderBrowseListOnly();
    }

    function deleteCard(cardId) {
      if (state.armedDeleteId !== cardId) {
        state.armedDeleteId = cardId;
        renderBrowseListOnly();
        return;
      }
      state.cards = state.cards.filter(c => c.id !== cardId);
      delete state.srs[cardId];
      state.armedDeleteId = null;
      saveState();
      buildQueue(false, false);
      renderModalBody();
      showToast("Card deleted", "warn");
    }

    function renderBrowseListOnly() {
      const container = document.getElementById("browse-list-host");
      if (!container) return;
      const q = state.browseSearch.trim().toLowerCase();
      const filtered = state.cards.filter(c => {
        if (!q) return true;
        return (
          (c.word || "").toLowerCase().includes(q) ||
          (c.english || "").toLowerCase().includes(q) ||
          (c.level || "").toLowerCase().includes(q) ||
          (c.deckType || "").toLowerCase().includes(q) ||
          (c.valency || "").toLowerCase().includes(q)
        );
      });

      if (!filtered.length) {
        container.innerHTML = `<div style="text-align:center;padding:24px 8px;font-size:12.5px;color:var(--text-muted);">No cards match "${esc(state.browseSearch)}".</div>`;
        return;
      }

      container.innerHTML = filtered.map(c => {
        const hard = isCardHard(c.id);
        const armed = state.armedDeleteId === c.id;
        return `
          <div class="browse-card">
            <div class="browse-info">
              <div class="badge-row">
                <span class="pill pill-${c.level}">${esc(c.level)}</span>
                <span class="pill">${esc(c.deckType === "verb_trap" ? "Verb Trap" : c.deckType === "case_practice" ? "Case" : POS_LABELS[c.pos] || c.pos)}</span>
                ${hard ? `<span class="pill pill-orange">🔥 Hard</span>` : ""}
              </div>
              <div class="browse-word">${c.pos === "noun" && c.article ? `${esc(c.article)} ` : ""}${esc(c.word)}</div>
              <p class="browse-en">${esc(c.english)}</p>
            </div>
            <div class="browse-actions">
              <button type="button" class="sm-act-btn" onclick="startEditCard('${jsArg(c.id)}')">Edit</button>
              <button type="button" class="sm-act-btn ${armed ? "danger-armed" : "danger"}" onclick="deleteCard('${jsArg(c.id)}')">${armed ? "Confirm?" : "Del"}</button>
            </div>
          </div>
        `;
      }).join("");
    }

    /* --- TAB 3: IMPORT / EXPORT / RESET --- */
    function copyText(text, toastMsg) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) {
          showToast(toastMsg || "Copied!", "ok");
          return;
        }
      } catch (_) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(toastMsg || "Copied!", "ok"))
          .catch(() => showToast("Copy blocked — copy manually.", "err"));
      } else {
        showToast("Copy blocked — copy manually.", "err");
      }
    }

    function downloadDeckJson() {
      const payload = JSON.stringify(state.cards, null, 2);
      try {
        const blob = new Blob([payload], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "wortflow-deck.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast("Downloaded wortflow-deck.json", "ok");
      } catch (_) {
        copyText(payload, "Copied deck JSON!");
      }
    }

    function handleJsonFileUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const ta = document.getElementById("io-textarea");
        if (ta) ta.value = String(reader.result || "");
        const fb = document.getElementById("io-feedback");
        if (fb) fb.innerHTML = `<div class="feedback-msg feedback-ok">Loaded "${esc(file.name)}". Tap Merge or Replace All below.</div>`;
      };
      reader.onerror = () => showToast("Failed to read file.", "err");
      reader.readAsText(file);
    }

    /**
     * Validate and import JSON array OR { cards: [...] } object (supports DeepSeek JSON mode!).
     */
    function importJsonDeck(replaceAll = false) {
      const ta = document.getElementById("io-textarea");
      const fb = document.getElementById("io-feedback");
      if (!ta || !fb) return;

      try {
        const parsed = JSON.parse(ta.value);
        let arr = null;
        if (Array.isArray(parsed)) {
          arr = parsed;
        } else if (parsed && Array.isArray(parsed.cards)) {
          arr = parsed.cards;
        }

        if (!arr || !arr.length) {
          fb.innerHTML = `<div class="feedback-msg feedback-err">Expected a non-empty JSON array <code>[...]</code> or <code>{"cards": [...]}</code>.</div>`;
          return;
        }

        const validDeckTypes = ["vocab", "verb_trap", "case_practice"];
        const normalized = [];

        for (let i = 0; i < arr.length; i++) {
          const it = arr[i];
          if (!it || typeof it !== "object" || !it.word || !it.english) {
            fb.innerHTML = `<div class="feedback-msg feedback-err">Card #${i + 1} is missing required "word" or "english" field.</div>`;
            return;
          }
          const level = String(it.level || "B1").toUpperCase();
          if (!LEVELS.includes(level)) {
            fb.innerHTML = `<div class="feedback-msg feedback-err">Card #${i + 1} has invalid level "${esc(level)}". Allowed: A1, A2, B1, B2.</div>`;
            return;
          }
          const deckType = validDeckTypes.includes(it.deckType) ? it.deckType : "vocab";
          const id = String(it.id || `${level.toLowerCase()}-${String(it.word).toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").slice(0, 26)}-${i}`);

          normalized.push({
            id,
            level,
            deckType,
            pos: it.pos || (deckType === "case_practice" ? "case_practice" : "noun"),
            word: String(it.word).trim(),
            english: String(it.english).trim(),
            article: it.article || null,
            plural: it.plural || null,
            isIrregular: Boolean(it.isIrregular),
            conjugations: it.conjugations && typeof it.conjugations === "object" ? {
              praesens: it.conjugations.praesens || null,
              praeteritum: it.conjugations.praeteritum || null,
              perfekt: it.conjugations.perfekt || null,
              stemChange: it.conjugations.stemChange || null
            } : null,
            valency: it.valency || null,
            trapNote: it.trapNote || null,
            answer: it.answer || null,
            fullSentence: it.fullSentence || null,
            promptHint: it.promptHint || null,
            examples: Array.isArray(it.examples) ? it.examples.filter(e => e && e.de).map(e => ({ de: String(e.de), en: String(e.en || "") })) : []
          });
        }

        if (replaceAll) {
          state.cards = normalized;
        } else {
          const byId = new Map(state.cards.map(c => [c.id, c]));
          normalized.forEach(c => byId.set(c.id, c));
          state.cards = Array.from(byId.values());
        }

        saveState();
        buildQueue(false, false);
        closeModal();
        showToast(`${replaceAll ? "Replaced deck" : "Merged cards"} (${state.cards.length} total)`, "ok");
      } catch (err) {
        fb.innerHTML = `<div class="feedback-msg feedback-err">Invalid JSON: ${esc(err.message)}</div>`;
      }
    }

    function handleResetProgress() {
      if (!state.armedResetProgress) {
        state.armedResetProgress = true;
        renderModalBody();
        return;
      }
      state.srs = {};
      state.streak = 0;
      state.armedResetProgress = false;
      saveState();
      buildQueue(false, false);
      renderModalBody();
      showToast("Progress, streaks & Hard flags reset", "ok");
    }

    function handleRestoreDefaultDeck() {
      if (!state.armedRestoreDefaults) {
        state.armedRestoreDefaults = true;
        renderModalBody();
        return;
      }
      state.cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
      state.armedRestoreDefaults = false;
      saveState();
      buildQueue(false, false);
      renderModalBody();
      showToast("Restored 36 default starter cards", "ok");
    }

    /* --- TAB 4: VOICE SELECTOR --- */
    function onVoiceSelectChange(val) {
      state.preferredVoiceName = val;
      saveState();
      showToast(val ? `Voice set: ${val}` : "Voice set to Auto (de-DE)", "ok");
    }

    /* --- RENDER MODAL CONTENT --- */
    function renderModalBody() {
      document.getElementById("modal-title").textContent =
        state.modalTab === "add" && state.editingCardId ? "Edit Card" : "Deck Manager";

      document.getElementById("mtab-add").textContent = state.editingCardId ? "Edit Card" : "+ Add Card";
      document.getElementById("mtab-browse").textContent = `Browse (${state.cards.length})`;

      ["add", "browse", "io", "voice"].forEach(t => {
        const b = document.getElementById(`mtab-${t}`);
        if (b) b.className = `mtab-btn ${state.modalTab === t ? "active" : ""}`;
      });

      const body = document.getElementById("modal-body");
      if (!body) return;

      /* TAB 1: + ADD / EDIT CARD */
      if (state.modalTab === "add") {
        if (!formDraft) resetFormDraft(null);
        const isCase = formDraft.deckType === "case_practice";
        const isNoun = !isCase && formDraft.pos === "noun";
        const isVerb = !isCase && (formDraft.pos === "verb" || formDraft.deckType === "verb_trap");

        body.innerHTML = `
          <form onsubmit="saveCustomCard(event)" style="display:flex;flex-direction:column;gap:11px;">
            <div class="form-grid-3">
              <div class="field-group">
                <label class="field-label" for="f-deckType">Pack</label>
                <select id="f-deckType" class="select-ctrl" onchange="onFormDeckTypeChange()">
                  <option value="vocab" ${formDraft.deckType === "vocab" ? "selected" : ""}>Vocab</option>
                  <option value="verb_trap" ${formDraft.deckType === "verb_trap" ? "selected" : ""}>Verb Trap</option>
                  <option value="case_practice" ${formDraft.deckType === "case_practice" ? "selected" : ""}>Case Practice</option>
                </select>
              </div>
              <div class="field-group">
                <label class="field-label" for="f-level">Level</label>
                <select id="f-level" class="select-ctrl">
                  ${LEVELS.map(l => `<option value="${l}" ${formDraft.level === l ? "selected" : ""}>${l}</option>`).join("")}
                </select>
              </div>
              <div class="field-group">
                <label class="field-label" for="f-pos">POS</label>
                <select id="f-pos" class="select-ctrl" onchange="onFormPosChange()" ${isCase ? "disabled" : ""}>
                  ${isCase
                    ? `<option value="case_practice" selected>Case Practice</option>`
                    : ["verb", "noun", "adjective", "adverb", "conjunction", "phrase"].map(p =>
                        `<option value="${p}" ${formDraft.pos === p ? "selected" : ""}>${POS_LABELS[p]}</option>`
                      ).join("")}
                </select>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="f-word">${isCase ? "Challenge Sentence (use ___ for blank)" : "German Word / Expression"}</label>
              <input id="f-word" class="input-ctrl" type="text" value="${esc(formDraft.word)}" placeholder="${isCase ? "Ich warte ___ (der Zug)." : "e.g. verzichten auf"}" required />
            </div>

            <div class="field-group">
              <label class="field-label" for="f-english">English Meaning</label>
              <input id="f-english" class="input-ctrl" type="text" value="${esc(formDraft.english)}" placeholder="${isCase ? "I am waiting for the train." : "e.g. to do without / give up"}" required />
            </div>

            ${isNoun ? `
              <div class="form-grid-2">
                <div class="field-group">
                  <label class="field-label" for="f-article">Article</label>
                  <select id="f-article" class="select-ctrl">
                    <option value="der" ${formDraft.article === "der" ? "selected" : ""}>der (Masc)</option>
                    <option value="die" ${formDraft.article === "die" ? "selected" : ""}>die (Fem)</option>
                    <option value="das" ${formDraft.article === "das" ? "selected" : ""}>das (Neut)</option>
                  </select>
                </div>
                <div class="field-group">
                  <label class="field-label" for="f-plural">Plural</label>
                  <input id="f-plural" class="input-ctrl" type="text" value="${esc(formDraft.plural)}" placeholder="e.g. die Entscheidungen" />
                </div>
              </div>
            ` : ""}

            ${isCase ? `
              <div class="form-grid-2">
                <div class="field-group">
                  <label class="field-label" for="f-answer">Missing Answer</label>
                  <input id="f-answer" class="input-ctrl" type="text" value="${esc(formDraft.answer)}" placeholder="e.g. auf den Zug" />
                </div>
                <div class="field-group">
                  <label class="field-label" for="f-promptHint">Prompt Hint Badge</label>
                  <input id="f-promptHint" class="input-ctrl" type="text" value="${esc(formDraft.promptHint)}" placeholder="Preposition + Case" />
                </div>
              </div>
              <div class="field-group">
                <label class="field-label" for="f-fullSentence">Full Corrected German Sentence</label>
                <input id="f-fullSentence" class="input-ctrl" type="text" value="${esc(formDraft.fullSentence)}" placeholder="Ich warte auf den Zug." />
              </div>
            ` : ""}

            ${isVerb ? `
              <label class="check-row">
                <input id="f-irregular" type="checkbox" ${formDraft.isIrregular ? "checked" : ""} />
                <span>Irregular / Stem-Changing Verb</span>
              </label>
              <div class="form-grid-2">
                <div class="field-group">
                  <label class="field-label" for="f-praesens">Präsens (er/sie/es)</label>
                  <input id="f-praesens" class="input-ctrl" type="text" value="${esc(formDraft.praesens)}" placeholder="er empfiehlt" />
                </div>
                <div class="field-group">
                  <label class="field-label" for="f-praeteritum">Präteritum</label>
                  <input id="f-praeteritum" class="input-ctrl" type="text" value="${esc(formDraft.praeteritum)}" placeholder="er empfahl" />
                </div>
              </div>
              <div class="form-grid-2">
                <div class="field-group">
                  <label class="field-label" for="f-perfekt">Perfekt (hat/ist)</label>
                  <input id="f-perfekt" class="input-ctrl" type="text" value="${esc(formDraft.perfekt)}" placeholder="hat empfohlen" />
                </div>
                <div class="field-group">
                  <label class="field-label" for="f-stemChange">Stem Change (optional)</label>
                  <input id="f-stemChange" class="input-ctrl" type="text" value="${esc(formDraft.stemChange)}" placeholder="e → ie" />
                </div>
              </div>
            ` : ""}

            <div class="field-group">
              <label class="field-label" for="f-valency">Valency / Case Rule (optional)</label>
              <input id="f-valency" class="input-ctrl" type="text" value="${esc(formDraft.valency)}" placeholder="e.g. auf + Akkusativ · + Dativ" />
            </div>

            <div class="field-group">
              <label class="field-label" for="f-trapNote">Why English Tricks You / Note (optional)</label>
              <textarea id="f-trapNote" class="textarea-ctrl" placeholder="Explain preposition traps or English false-friend pitfalls…">${esc(formDraft.trapNote)}</textarea>
            </div>

            <div style="display:flex;flex-direction:column;gap:8px;">
              <div class="section-head">
                <span class="field-label">Example Sentences</span>
                <button type="button" class="tiny-pill-btn reveal" onclick="addExampleFormRow()">+ Add Example</button>
              </div>
              <div style="font-size:11px;color:var(--text-muted);line-height:1.4;">
                Tip: Wrap prepositions/articles in <code>[[double brackets]]</code> (e.g. <code>Ich warte [[auf den]] Bus.</code>) to create tap-to-reveal cloze blanks.
              </div>
              ${formDraft.examples.map((ex, idx) => `
                <div class="ex-form-row">
                  <div class="ex-form-head">
                    <span>Example ${idx + 1}</span>
                    ${formDraft.examples.length > 1 ? `<button type="button" style="color:var(--rose);font-size:10.5px;font-weight:800;" onclick="removeExampleFormRow(${idx})">Remove</button>` : ""}
                  </div>
                  <input id="f-ex-de-${idx}" class="input-ctrl" type="text" value="${esc(ex.de)}" placeholder="German sentence (optional [[cloze]])" />
                  <input id="f-ex-en-${idx}" class="input-ctrl" type="text" value="${esc(ex.en)}" placeholder="English translation" />
                </div>
              `).join("")}
            </div>

            <div id="form-feedback"></div>

            <div style="display:flex;gap:8px;">
              ${state.editingCardId ? `<button type="button" class="btn-tone btn-ghost" style="flex:1;" onclick="cancelEditCard()">Cancel</button>` : ""}
              <button type="submit" class="btn-primary-full" style="flex:2;">${state.editingCardId ? "Save Changes" : "Save Card to Deck"}</button>
            </div>
          </form>
        `;
        return;
      }

      /* TAB 2: BROWSE & SEARCH */
      if (state.modalTab === "browse") {
        body.innerHTML = `
          <input type="search" class="input-ctrl" value="${esc(state.browseSearch)}" oninput="onBrowseSearch(this.value)" placeholder="Search German, English, A1–B2, verb_trap, valency…" />
          <div id="browse-list-host" class="browse-list"></div>
        `;
        renderBrowseListOnly();
        return;
      }

      /* TAB 3: IMPORT / EXPORT */
      if (state.modalTab === "io") {
        const schemaPreview = JSON.stringify([DEFAULT_CARDS[14], DEFAULT_CARDS[26]], null, 2);
        window.__wfSchemaCopy = schemaPreview;

        body.innerHTML = `
          <label class="file-drop">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>Upload .json File from Phone / PC</span>
            <input type="file" accept=".json,application/json" onchange="handleJsonFileUpload(event)" style="display:none;" />
          </label>

          <div class="field-group">
            <label class="field-label" for="io-textarea">Paste JSON Array [...] or {"cards": [...]}</label>
            <textarea id="io-textarea" class="textarea-ctrl textarea-mono" placeholder='Paste WortFlow JSON cards here…'></textarea>
          </div>

          <div id="io-feedback"></div>

          <div class="btn-row-2">
            <button type="button" class="btn-tone btn-cyan" onclick="importJsonDeck(false)">Merge by ID</button>
            <button type="button" class="btn-tone btn-violet" onclick="importJsonDeck(true)">Replace All</button>
          </div>

          <div class="btn-row-2">
            <button type="button" class="btn-tone btn-emerald" onclick="downloadDeckJson()">Download Deck JSON</button>
            <button type="button" class="btn-tone btn-ghost" onclick="copyText(JSON.stringify(state.cards, null, 2), 'Copied full deck JSON!')">Copy Deck JSON</button>
          </div>

          <details class="schema-details">
            <summary>Exact JSON Schema Preview</summary>
            <div style="margin-top:8px;display:flex;justify-content:flex-end;">
              <button type="button" class="tiny-pill-btn reveal" onclick="copyText(window.__wfSchemaCopy, 'Copied schema example!')">Copy Schema</button>
            </div>
            <pre class="code-block">${esc(schemaPreview)}</pre>
          </details>

          <button type="button" class="btn-tone ${state.armedResetProgress ? "btn-rose" : "btn-ghost"}" style="${state.armedResetProgress ? "" : "color:var(--rose);"}" onclick="handleResetProgress()">
            ${state.armedResetProgress ? "Tap Again to Confirm Resetting Progress" : "Reset Progress, Streaks & Hard Flags"}
          </button>

          <button type="button" class="btn-tone ${state.armedRestoreDefaults ? "btn-amber" : "btn-ghost"}" onclick="handleRestoreDefaultDeck()">
            ${state.armedRestoreDefaults ? "Tap Again to Restore 36 Default Cards" : "Restore Default 36-Card Deck"}
          </button>
        `;
        return;
      }

      /* TAB 4: VOICE & OFFLINE */
      const voices = refreshGermanVoices();
      const activeVoice = getSelectedGermanVoice();

      body.innerHTML = `
        <div class="section-box">
          <div class="section-head">
            <span class="section-label">German Speech Voice (de-DE)</span>
            <span class="pill ${activeVoice ? "pill-emerald" : "pill-amber"}">${activeVoice ? (activeVoice.localService ? "Offline Ready" : "System Voice") : "No de-DE Found"}</span>
          </div>

          <div class="field-group">
            <label class="field-label" for="voice-select">Select Voice</label>
            <select id="voice-select" class="select-ctrl" onchange="onVoiceSelectChange(this.value)">
              <option value="">Auto-select best de-DE voice</option>
              ${voices.map(v => `
                <option value="${esc(v.name)}" ${state.preferredVoiceName === v.name ? "selected" : ""}>
                  ${esc(v.name)} (${esc(v.lang)})${v.localService ? " · Local" : ""}
                </option>
              `).join("")}
            </select>
          </div>

          <button type="button" class="btn-tone btn-cyan" data-audio-btn="voice-test" onclick="speakDE('Übung macht den Meister. Ich warte auf den Zug.', 'voice-test', 1.0, event)">
            ${speakerSvg(15)}
            <span>Test German Voice</span>
          </button>
        </div>

        <div class="section-box">
          <span class="section-label">Offline Audio on Android (Airplane Mode)</span>
          <p style="margin:0;font-size:12.5px;line-height:1.5;color:var(--text-sub);">
            To keep pronunciation working with zero signal:<br/>
            <strong>Settings → Accessibility → Text-to-speech output → gear icon → Install voice data → German (Germany)</strong>.
          </p>
          <p style="margin:0;font-size:11.5px;line-height:1.45;color:var(--text-muted);">
            On iPhone/iPad: <strong>Settings → Accessibility → Spoken Content → Voices → German</strong>.
          </p>
        </div>

        <div class="section-box">
          <span class="section-label">Desktop Keyboard Shortcuts</span>
          <table class="kbd-table">
            <tr><td><span class="kbd-key">Space</span> / <span class="kbd-key">Enter</span></td><td style="color:var(--text-sub);">Show Answer (flip card)</td></tr>
            <tr><td><span class="kbd-key">1</span> · <span class="kbd-key">2</span> · <span class="kbd-key">3</span></td><td style="color:var(--text-sub);">Rate Again · Good · Easy</td></tr>
            <tr><td><span class="kbd-key">R</span></td><td style="color:var(--text-sub);">Replay German audio (1.0x)</td></tr>
            <tr><td><span class="kbd-key">S</span></td><td style="color:var(--text-sub);">Play slow audio (0.7x)</td></tr>
            <tr><td><span class="kbd-key">H</span></td><td style="color:var(--text-sub);">Toggle 🔥 Hard flag on card</td></tr>
          </table>
        </div>
      `;
    }

    /* =========================================================================
       9. DESKTOP KEYBOARD SHORTCUTS (AUTO-DISABLED IN INPUTS / MODAL)
       ========================================================================= */
    document.addEventListener("keydown", (e) => {
      const modalOpen = !document.getElementById("deck-modal").classList.contains("hidden");
      if (modalOpen) {
        if (e.key === "Escape") closeModal();
        return;
      }

      const tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (e.target && e.target.isContentEditable)) {
        return;
      }

      const card = state.queue[0];
      if (!card) return;

      const key = e.key.toLowerCase();
      if ((e.code === "Space" || e.key === "Enter") && !state.isRevealed) {
        e.preventDefault();
        flipCard();
      } else if (state.isRevealed && (key === "1" || key === "2" || key === "3")) {
        e.preventDefault();
        if (key === "1") rateCard("again");
        if (key === "2") rateCard("good");
        if (key === "3") rateCard("easy");
      } else if (key === "r" || key === "s") {
        e.preventDefault();
        const rate = key === "s" ? 0.7 : 1.0;
        if (card.deckType === "case_practice") {
          if (state.isRevealed) {
            speakDE(card.fullSentence || card.word, rate < 1 ? "back-slow" : "back-1x", rate);
          }
        } else if (state.isRevealed) {
          const phrase = card.pos === "noun" && card.article ? `${card.article} ${card.word}` : card.word;
          speakDE(phrase, rate < 1 ? "back-slow" : "back-1x", rate);
        } else if (state.currentPromptMode === "de_en" || state.currentPromptMode === "listen") {
          const phrase = state.currentPromptMode === "listen" && card.pos === "noun" && card.article
            ? `${card.article} ${card.word}` : card.word;
          const btnId = state.currentPromptMode === "listen"
            ? (rate < 1 ? "listen-slow" : "listen-hero")
            : (rate < 1 ? "front-slow" : "front-1x");
          speakDE(phrase, btnId, rate);
        }
      } else if (key === "h") {
        e.preventDefault();
        toggleHardFlag(card.id);
      }
    });

    // Boot application
    loadState();
    resetFormDraft(null);
    buildQueue(false, false);
  </script>
</body>
</html>
